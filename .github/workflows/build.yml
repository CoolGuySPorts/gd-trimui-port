name: Build GD Loader ARM64

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ARM64 Cross-Compiler and SDL2
  run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          REPO="http://ports"
          REPO="${REPO}://"
          cat <<EOF | sudo tee -a /etc/apt/sources.list
          deb [arch=arm64] $REPO jammy main restricted universe multiverse
          deb [arch=arm64] $REPO jammy-updates main restricted universe multiverse
          deb [arch=arm64] $REPO jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cmake libsdl2-dev:arm64 libgles2-mesa-dev:arm64

      - name: Build Binary
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu
          make -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd_loader_arm64
          path: build/gd_loader
          
