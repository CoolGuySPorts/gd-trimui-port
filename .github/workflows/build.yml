name: Build GD Loader ARM64

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ARM64 Cross-Compiler and SDL2
        run: |
          REPO=$(echo "aHR0cDovL3BvcnRzLnVidW50dS5jb20vdWJ1bnR1LXBvcnRzCg==" | base64 -d)
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/*
          sudo bash -c "cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=amd64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF"
          echo "deb [arch=arm64] $REPO jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] $REPO jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] $REPO jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake libsdl2-dev:arm64 libgles2-mesa-dev:arm64

      - name: Build Binary
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
          make -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd_loader_arm64
          path: build/gd_loader
          
